# 修改此文件后直接运行，无需编译：
# python3 docs/experiment_process/experiments/tools/ltv_gain_scan/run_manual_euroc.py

sequence: MH_01_easy
mode: GVL                    # OFF / G / V / L / GVL

# null：使用对应场景和模式的冻结强度；数字：手动覆盖。
# 这里只调辅助融合权重，不改变 Observer 内部增益。
# 未启用的分支请保持 null 或 0；启用的分支必须大于 0。
weights:
  G: null
  V: null
  L: null

# 原始 ASL 目录，包含各序列的 mav0/cam0、cam1、imu0。
dataset_root: /home/he/datasets/euroc/ASL

# compact_v2：一次离散相机修正，原生 MSCKF 联合更新；本轮重新评估。
# 改为 null 可以选择历史最终实验的冻结二进制。
install_root: /home/he/open_vins_ltv_ws/install_compact_v2

# 每次创建独立结果目录，不覆盖之前的实验。
output_root: /tmp/openvins_ltv_manual
cpu_affinity: [0, 1]
short_seconds: 0             # 0=完整序列；(0,40]秒=短段检查
